plugins { id 'java' }

group = rootProject.group
version = rootProject.version

repositories {
    mavenCentral()
    maven { url = 'https://maven.creeperhost.net' }
}

java {
    toolchain.languageVersion = JavaLanguageVersion.of(25)
    sourceCompatibility = JavaVersion.VERSION_1_8
    targetCompatibility = JavaVersion.VERSION_1_8
}

// Compile optional modern loader adapters with JDK 25 while retaining Java 8 bytecode.
configurations.compileClasspath.attributes {
    attribute(TargetJvmVersion.TARGET_JVM_VERSION_ATTRIBUTE, 25)
}

dependencies {
    compileOnly files('src/main/resources/launchwrapper-of-2.3.jar')

    compileOnly('cpw.mods:modlauncher:11.0.5') { transitive = false }
    compileOnly('cpw.mods:securejarhandler:3.0.9') { transitive = false }
    compileOnly('net.neoforged.fancymodloader:loader:11.0.16') { transitive = false }
    compileOnly 'org.ow2.asm:asm:9.10.1'
    compileOnly 'org.ow2.asm:asm-tree:9.10.1'
    compileOnly 'org.apache.logging.log4j:log4j-api:2.26.0'
}

tasks.withType(JavaCompile).configureEach {
    options.encoding = 'UTF-8'
    options.compilerArgs += ['-proc:none']
}

tasks.named('processResources') { exclude 'META-INF/MANIFEST.MF' }

tasks.named('jar') {
    manifest { from 'src/main/resources/META-INF/MANIFEST.MF' }
}
