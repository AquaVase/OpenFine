plugins { id 'java' }

group = rootProject.group
version = rootProject.version

java {
    toolchain { languageVersion = JavaLanguageVersion.of(25) }
}

def buildInfoDirectory = layout.buildDirectory.dir('generated/resources/buildInfo')
def buildInfoFile = buildInfoDirectory.map { it.file('buildof.txt') }
def generateBuildInfo = tasks.register('generateBuildInfo') {
    outputs.file(buildInfoFile)
    outputs.upToDateWhen { false }
    doLast {
        def output = buildInfoFile.get().asFile
        output.parentFile.mkdirs()
        output.setText(java.time.LocalDateTime.now().format(java.time.format.DateTimeFormatter.ofPattern('yyyyMMdd-HHmmss')) + '\n', 'UTF-8')
    }
}
sourceSets.main.resources.srcDir(buildInfoDirectory)
tasks.named('processResources') { dependsOn generateBuildInfo }

// OptiFine and patched Minecraft reference each other's added members.
// Compile them together in the root task, then give each module its own output.
def jointCompile = rootProject.tasks.named('compileJava', JavaCompile)

// Reuse patchgen/ForgeGradle repositories, including the generated mapped library
// repository and its sources artifact, without hard-coding a local JAR path.
rootProject.repositories.each { repositories.add(it) }

// Expose patched game members and the Minecraft libraries to the IDE as well.
dependencies {
    compileOnly(project(':')) { transitive = false }
}
configurations.compileOnly.withDependencies { dependencies ->
    // Copy library declarations rather than a task's resolved file collection:
    // IDE Gradle import needs module metadata to attach Minecraft and its sources.
    dependencies.addAll(rootProject.configurations.compileClasspath.allDependencies
        .findAll { !(it instanceof ProjectDependency) }
        .collect { it.copy() })
}

tasks.named('compileJava', JavaCompile) {
    enabled = false
}

rootProject.registerJointClassOutput(project)
